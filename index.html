<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        display: flex;
        flex-direction: column;
      }
      input,
      .big input {
        color: white;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="container" s>
      <p
        style="
          text-align: center;
          font-size: 35px;
          width: 350px;
          color: rgb(0, 0, 86);
        "
      >
        ROMAN NUMERAL CONVERTER
      </p>
      <div
        style="
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          gap: 20px;
          background-color: rgb(21, 21, 59);
          padding: 20px;
          border-radius: 20px;
        "
        class="big"
      >
        <p
          style="
            color: white;
            font-family: sans-serif;
            font-size: 20px;
            font-weight: 800;
          "
        >
          Enter a Number:
        </p>
        <input
          style="
            width: 277px;
            padding: 10px;
            background-color: rgb(132, 32, 163);
            color: white;
            border-radius: 20px;
          "
          id="enterNum"
          type="number"
          placeholder="Enter a number"
        />
        <button
          style="
            width: 300px;
            padding: 10px;
            background-color: rgb(68, 0, 255);
            border: 2px solid rgb(255, 179, 39);
            font-size: 17px;
            border: none;
            color: white;
            border-radius: 20px;
          "
        >
          Convert
        </button>
      </div>
      <div
        class="small"
        style="
          background-color: rgb(21, 21, 59);
          margin-top: 20px;
          justify-content: center;
          align-items: center;
          display: flex;
          color: white;
          font-size: 25px;
        "
      ></div>
    </div>
    <script>
      let input = document.querySelector("input");

      let btn = document.querySelector("button");
      btn.addEventListener("click", function () {
        let number = Number(input.value);
        let result = "";
        if (number === 1) {
          result = "I";
        }
        if (number === 2) {
          result = "II";
        }
        if (number === 3) {
          result = "III";
        }
        if (number === 4) {
          result = "IV";
        }
        if (number === 5) {
          result = "V";
        }
        if (number === 6) {
          result = "VI";
        }
        if (number === 7) {
          result = "VII";
        }
        if (number === 8) {
          result = "VIII";
        }
        if (number === 9) {
          result = "IX";
        }
        if (number === 10) {
          result = "X";
        }
        if (number === 11) {
          result = "XI";
        }
        if (number === 12) {
          result = "XII";
        }
        if (number === 13) {
          result = "XIII";
        }
        if (number === 14) {
          result = "XIV";
        }
        if (number === 15) {
          result = "XV";
        }
        if (number === 16) {
          result = "XVI";
        }
        if (number === 17) {
          result = "XVII";
        }
        if (number === 18) {
          result = "XVIII";
        }
        if (number === 19) {
          result = "XIX";
        }
        if (number === 20) {
          result = "XX";
        }
        if (number === 21) {
          result = "XXI";
        }
        if (number === 22) {
          result = "XXII";
        }
        if (number === 23) {
          result = "XXIII";
        }
        if (number === 24) {
          result = "XXIV";
        }
        if (number === 25) {
          result = "XXV";
        }
        if (number === 26) {
          result = "XXVI";
        }
        if (number === 27) {
          result = "XXVII";
        }
        if (number === 28) {
          result = "XVIII";
        }
        if (number === 29) {
          result = "XXIX";
        }
        if (number === 30) {
          result = "XXX";
        }
        let container = document.querySelector(".small");
        container.innerHTML = "";
        let box = document.createElement("div");
        box.innerHTML = `
           <div
        class="small"
        style="
          background-color: rgb(21, 21, 59);
          margin-top: 20px;
          justify-content: center;
          align-items: center;
          display: flex;
          color: white;
          font-size: 25px;
        "
      >
        <p class="result">${result}</p>
      </div>
        `;

        container.appendChild(box);
      });
    </script>
  </body>
</html>
